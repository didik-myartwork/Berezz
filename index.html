<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Berezz — Chat-to-Action Copilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%2318181b'/%3E%3Cpath d='M8.5 14.4l3.6 3.6 7.4-8' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preload" href="./app/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="./app/styles.css" />
<script>
  try { const t = localStorage.getItem('berezz-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#view">Lompat ke konten utama</a>
<div class="shell">
  <nav class="side" id="side" aria-label="Menu utama"></nav>
  <div class="workspace" id="view" tabindex="-1">
    <div class="empty"><p>Memuat Berezz…</p></div>
  </div>
</div>
<dialog class="dlg" id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Berezz membutuhkan JavaScript.</p></noscript>
<script type="module" src="./app/ui.js"></script>
</body>
</html>
